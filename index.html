<script id="open-guard">
/* ถ้าโค้ดส่วนไหนพัง หน้าต้องยังเปิดได้ และถ้าเปิดไม่ได้ให้บอกสาเหตุบนจอ */
(function () {
  var last = '';
  window.reportErr = function (e) { last = String((e && (e.message || e)) || ''); if (window.console) console.warn(e); };
  window.addEventListener('error', function (e) { if (e.message) last = e.message + ' @' + e.lineno + ':' + e.colno; });
  var timer = 0;
  window.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href="#search"],a[data-kind="buy"][href^="#buy-"]');
    if (!a) return;
    clearInterval(timer);
    var sel = a.getAttribute('href') === '#search' ? '#sp.on' : '#pp.on', n = 0;
    timer = setInterval(function () {
      /* เปิดได้แล้ว (แม้ผู้ใช้จะรีบกดปิด) = ไม่ต้องแจ้ง */
      if (document.querySelector(sel)) { clearInterval(timer); return; }
      if (++n < 22) return;
      clearInterval(timer);
      var box = document.getElementById('openErr') || document.body.appendChild(document.createElement('div'));
      box.id = 'openErr';
      box.style.cssText = 'position:fixed;left:12px;right:12px;top:35%;z-index:99;padding:14px;background:#2b2e3b;border:2px solid #ff9b9b;border-radius:12px;color:#fff;font:14px/1.5 sans-serif;word-break:break-word';
      box.textContent = 'เปิดหน้าไม่ได้ ช่วยแคปจอนี้ส่งมาให้หน่อย (แตะเพื่อปิด): ' + (last || 'ไม่พบข้อความผิดพลาด');
      box.onclick = function () { box.remove(); };
    }, 100);
  }, true);
})();
</script>
<title>CreationLab Studio - Minecraft Bedrock Addon</title>
<script>
/* CreationLab patch v2 */
(function () {
  var FORCE_ANIM = true;
  var REAL_MEM = navigator.deviceMemory, REAL_CPU = navigator.hardwareConcurrency;
  var SAVE_DATA = !!(navigator.connection && navigator.connection.saveData);

  /* ความกว้างคอลัมน์จริง: มือถือ=เต็มจอ, แท็บเล็ต/คอม=ขยายตามความสูงจอ (480-900px) */
  /* ความกว้างจอจริง: ใช้ค่าที่เล็กกว่าระหว่าง layout viewport กับ innerWidth
     (หลังพลิกจอ Chrome มือถือบางครั้งรายงาน innerWidth กว้างเกินจริง ทำให้คอลัมน์ล้นจอทางขวา/ภาพขาด) */
  function VW() {
    var d = document.documentElement, c = d && d.clientWidth, w = window.innerWidth;
    return c && w ? Math.min(c, w) : (c || w);
  }
  window.CAPW = function () { return Math.min(VW(), Math.max(480, Math.min(900, window.innerHeight * 0.7))); };
  function setW() { try { document.documentElement.style.setProperty('--W', window.CAPW() + 'px'); } catch (e) {} }
  setW();
  window.addEventListener('resize', setW);
  /* หลังพลิกจอ ขนาดจอเปลี่ยนไม่พร้อมกัน -> คำนวณใหม่หลายรอบ แล้วสั่ง resize ให้ทุกส่วน (สไลด์/ชื่อ/ฉาก) จัดใหม่ */
  var kicking = false, lastW = -1;
  function kick() {
    /* พลิกจอ: คำนวณใหม่ 3 รอบ (ขนาดจอเปลี่ยนไม่พร้อมกัน) สั่ง resize เฉพาะเมื่อความกว้างเปลี่ยนจริง */
    [60, 300, 800].forEach(function (t, i) {
      setTimeout(function () {
        kicking = true; setW();
        var w = window.CAPW();
        if (w !== lastW || i === 2) { lastW = w; try { window.dispatchEvent(new Event('resize')); } catch (e) {} }
        kicking = false;
      }, t);
    });
  }
  window.addEventListener('orientationchange', kick);
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', kick); } catch (e) {}
  try { if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { if (!kicking) setW(); }); } catch (e) {}

  /* ---------- 0) ทำให้ทุกเครื่อง (รวมมือถือสเปคต่ำ / iPhone / แอป Google) ได้แอนิเมชันเด้งดึ๋งเต็มรูปแบบ ----------
     โค้ดเดิมตรวจ CPU<=4 คอร์ หรือ RAM<=4GB แล้วตัดแอนิเมชันเด้งทิ้ง (โหมด LITE)
     iPhone/Android ส่วนใหญ่เข้าเงื่อนไขนี้ จึงไม่เด้ง -> บังคับให้ไม่ติดเงื่อนไข */
  try { Object.defineProperty(Navigator.prototype, 'hardwareConcurrency', { get: function () { return 8; }, configurable: true }); } catch (e) {}
  try { Object.defineProperty(Navigator.prototype, 'deviceMemory', { get: function () { return 8; }, configurable: true }); } catch (e) {}

  /* ---------- 1) กันเว็บพังเมื่อ localStorage/sessionStorage ถูกบล็อก (in-app browser, private mode) ---------- */
  ['localStorage', 'sessionStorage'].forEach(function (n) {
    var ok = true;
    try { var s = window[n]; s.setItem('__t', '1'); s.removeItem('__t'); } catch (e) { ok = false; }
    if (ok) return;
    var d = {};
    var api = {
      getItem: function (k) { return k in d ? d[k] : null; },
      setItem: function (k, v) { d[k] = String(v); },
      removeItem: function (k) { delete d[k]; },
      clear: function () { d = {}; }
    };
    var px = new Proxy(api, {
      get: function (t, k) { return k in t ? t[k] : d[k]; },
      set: function (t, k, v) { d[k] = String(v); return true; }
    });
    try { Object.defineProperty(window, n, { value: px, configurable: true }); } catch (e) {}
  });

  /* ---------- 2) ไม่ให้ "ลดการเคลื่อนไหว / ประหยัดแบต" ปิดแอนิเมชัน ---------- */
  if (FORCE_ANIM && window.matchMedia) {
    var mm = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      if (/prefers-reduced-motion/i.test(q)) {
        return { matches: false, media: q, onchange: null, addListener: function () {}, removeListener: function () {},
          addEventListener: function () {}, removeEventListener: function () {}, dispatchEvent: function () { return false; } };
      }
      return mm(q);
    };
  }

  /* ---------- PERF governor: วัดความลื่นจริงของเครื่อง แล้วลดเอฟเฟกต์หนักๆ อัตโนมัติ (เครื่องแรงยังได้ครบ) ---------- */
  var PERF = window.PERF = { lite: false };
  var de = document.documentElement;
  try { Object.defineProperty(window, 'LITE', { get: function () { return PERF.lite; }, set: function () {}, configurable: true }); } catch (e) {}
  function goLite() {
    if (PERF.lite) return;
    PERF.lite = true;
    de.classList.add('lite');
    try { localStorage.perfLite = String(Date.now()); } catch (e) {}
    try { window.dispatchEvent(new Event('perf-lite')); } catch (e) {}
  }
  (function () {
    var t = 0;
    try { t = +localStorage.perfLite || 0; } catch (e) {}
    if ((t && Date.now() - t < 2.6e8) || SAVE_DATA || (REAL_MEM && REAL_MEM <= 2) || (REAL_CPU && REAL_CPU <= 2)) goLite();
  })();
  var strikes = 0, sampling = false;
  function sample(ms, thr) {
    if (sampling || PERF.lite) return;
    sampling = true;
    var last = 0, n = 0, sum = 0, end = 0;
    function f(t) {
      if (document.hidden) { sampling = false; return; }
      if (!end) end = t + ms;
      if (last) { var d = t - last; if (d < 250) { n++; sum += d; } }
      last = t;
      if (t < end) { requestAnimationFrame(f); return; }
      sampling = false;
      if (n >= 20 && sum / n > thr) { if (++strikes >= 2) goLite(); }
      else if (strikes) strikes--;
    }
    requestAnimationFrame(f);
  }
  window.addEventListener('load', function () { setTimeout(function () { sample(2500, 30); }, 1800); });
  try { new MutationObserver(function () { if (de.classList.contains('busy')) sample(900, 34); }).observe(de, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}

  /* ---------- 3) CSS ---------- */
  var css = '' +
    '@supports not (mix-blend-mode:plus-lighter){:root #pTitle .tfx i,:root #spTitle .tfx i{mix-blend-mode:normal}}' +
    (FORCE_ANIM ? '@media (prefers-reduced-motion:reduce){' +
      ':root .logo img{animation:logo-idle 4s ease-in-out infinite}' +
      ':root .tw svg{animation:twinkle var(--t,2.4s) ease-in-out var(--d,0s) infinite}' +
      ':root .pp.on #pTitle .tfx i,:root .sp.on #spTitle .tfx i{animation:tshine 3s linear infinite}' +
      ':root .sbar .ring2 i{animation:bspin 5s linear infinite}' +
      ':root .pp-fx .pg{animation:pg-drift var(--t,18s) ease-in-out var(--d,0s) infinite}' +
      ':root .pp-fx .pq{display:block;animation:pq-rise var(--t,9s) linear var(--d,0s) infinite}' +
      '}' : '') +

    /* ความสูงจอจริงบนมือถือ (แถบ URL ของ Safari/Google ขึ้นลงได้) */
    '@supports (height:100dvh){:root .page{min-height:max(100dvh,calc(var(--p)*(2556 - var(--lift))))}' +
    ':root body{min-height:100dvh}}' +

    /* แถบสถิติหน้าหลัก: อยู่ใต้เส้นขาว, เลเยอร์หน้าสุด, ดีไซน์พิกเซลเข้าธีม, ตัวเลขอยู่หลังคำ */
    '.hstats{position:relative;z-index:20;display:flex;align-items:stretch;' +
    'width:calc(var(--p)*1060);max-width:calc(100% - 16px);' +
    'height:max(30px,calc(var(--p)*66));' +
    'margin:calc(var(--p)*-40) auto max(calc(var(--p)*24),calc(30px - var(--p)*42));' +
    'background:linear-gradient(180deg,#363a4b 0,#2b2e3b 45%,#20222c 100%);' +
    'border:max(2px,calc(var(--p)*4)) solid #4a4e5e;border-radius:max(8px,calc(var(--p)*18));' +
    'box-shadow:inset 0 min(-3px,calc(var(--p)*-5)) 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14),0 max(2px,calc(var(--p)*5)) 0 rgba(0,0,0,.4),0 0 calc(var(--p)*30) rgba(255,255,255,.06);' +
    'overflow:hidden;pointer-events:none;font-family:"Minecraft","ThaiPixel","Prompt",sans-serif}' +
    '.hstats[hidden]{display:none}' +
    '.hstats .hs{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;' +
    'gap:max(4px,calc(var(--p)*12));padding:0 2px;white-space:nowrap}' +
    '.hstats .hs+.hs{border-left:max(2px,calc(var(--p)*3)) solid #3b3f4d;box-shadow:inset 1px 0 0 rgba(255,255,255,.07)}' +
    '.hstats .hs span{font-size:max(10px,calc(var(--p)*28));line-height:1;color:#a3a9c0;text-shadow:0 1px 0 #13141a}' +
    '.hstats .hs b{font-weight:400;font-size:max(14px,calc(var(--p)*42));line-height:1;color:#fff;letter-spacing:.5px;text-shadow:0 max(2px,calc(var(--p)*4)) 0 #3b3f4d,0 0 calc(var(--p)*18) rgba(255,255,255,.35)}' +
    '.hstats .dt{display:block;flex:none;width:max(7px,calc(var(--p)*18));height:max(7px,calc(var(--p)*18));border-radius:50%;background:#6bff8f;' +
    'box-shadow:0 0 0 max(1.5px,calc(var(--p)*3)) rgba(107,255,143,.25),0 0 max(6px,calc(var(--p)*18)) #6bff8f;animation:hpulse 1.8s ease-in-out infinite}' +
    '@keyframes hpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}' +

    /* จอเล็กมาก (iPhone SE / Android จอแคบ) */
    '@media (max-width:359px){:root .ptag b{letter-spacing:0}}';
  var st = document.createElement('style');
  st.id = 'extra-css';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  /* ---------- 4) ตัวเลข 1k ---------- */
  function K(n) {
    n = +n || 0;
    var a = Math.abs(n);
    if (a < 1000) return String(Math.round(n));
    var u = [[1e9, 'B'], [1e6, 'M'], [1e3, 'k']];
    for (var i = 0; i < 3; i++) {
      if (a >= u[i][0]) {
        var v = Math.floor(a / u[i][0] * 10) / 10;
        return (n < 0 ? '-' : '') + (v % 1 ? v.toFixed(1) : v.toFixed(0)) + u[i][1];
      }
    }
  }
  window.fmtK = K;

  /* ---------- 5) แถบ ออนไลน์ / เข้าเว็บ / สินค้า (เปิด-ปิดที่หน้าแอดมิน) ---------- */
  function init() {
    if (typeof SB === 'undefined' || !SB.url) return;
    var prod = document.getElementById('products');
    if (!prod) return;
    var base = SB.url.replace(/\/$/, '');
    var bar = document.createElement('div');
    bar.className = 'hstats';
    bar.hidden = true;
    prod.parentNode.insertBefore(bar, prod);
    var defs = [['online', 'ออนไลน์'], ['visits', 'เข้าเว็บ'], ['products', 'สินค้า']];

    function render(j) {
      var h = '';
      defs.forEach(function (d) {
        if (j[d[0]] == null) return;
        h += '<div class="hs">' + (d[0] === 'online' ? '<i class="dt"></i>' : '') + '<span>' + d[1] + '</span><b>' + K(j[d[0]]) + '</b></div>';
      });
      bar.innerHTML = h;
      bar.hidden = !h;
    }
    function load() {
      if (document.hidden) return;
      fetch(base + '/rest/v1/rpc/home_stats', {
        method: 'POST',
        headers: { apikey: SB.key, 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(render).catch(function () {});
    }
    load();
    setInterval(load, 30000);
    document.addEventListener('visibilitychange', load);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

.bubble.typing .dots{opacity:1;transition:opacity .2s ease .18s}
.bubble.typing .dots i{animation:typing 1s ease-in-out infinite}
.bubble.typing .dots i:nth-child(2){animation-delay:.15s}
.bubble.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:translateY(0);filter:brightness(1)}30%{transform:translateY(calc(var(--p)*-18));filter:brightness(1.7)}}
/* ปุ่มแจ้งเตือน / ตั้งค่า */
.hbtn::before{content:"";position:absolute;inset:calc(var(--p)*-20)}
.ndot{position:absolute;z-index:2;left:52%;top:5%;width:calc(var(--p)*40);height:calc(var(--p)*37);background:url('/notify-dot.png') center/contain no-repeat;pointer-events:none}
/* แถบโซเชียลด้านล่าง */
.social{position:fixed;z-index:25;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--p)*4);width:calc(var(--p)*840);height:calc(var(--p)*144);transform:translateX(-50%);background:url('/social-bar.png') center/100% 100% no-repeat}
.page{padding-bottom:calc(var(--p)*170)}
</style>
<style id="home-fx">
.app{overflow-anchor:none}
.products{touch-action:pan-y pinch-zoom}
.hfx{position:absolute;left:0;right:0;top:calc(var(--p)*(915 - var(--lift)));bottom:0;overflow:hidden;pointer-events:none;contain:strict}
.hfx i{position:absolute;display:block}
.hfx .pg{width:calc(var(--p)*900);height:calc(var(--p)*900);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.12),rgba(255,255,255,.04) 55%,rgba(255,255,255,0));animation:pg-drift var(--t,18s) ease-in-out var(--d,0s) infinite}
.hfx .pq{width:calc(var(--p)*var(--s,12));height:calc(var(--p)*var(--s,12));background:var(--c,#fff);opacity:0;will-change:transform,opacity;animation:pq-rise var(--t,9s) linear var(--d,0s) infinite}
html.ppon .hfx i,html.sopen .hfx i,html.busy .hfx i{animation-play-state:paused}
html.lite .hfx .pg{display:none}
</style>

  var DUR = 520, STEP = 40, EASE = 'cubic-bezier(.3,.8,.25,1)';

  /* ปรับขนาดชื่อเฉพาะการ์ดที่โชว์ และทำครั้งเดียวต่อขนาดจอ */

  /* โหลดและถอดรหัสรูปของชุดข้างเคียงไว้ก่อน ตอนสไลด์จะได้ไม่กระตุก */

  show();
})();
