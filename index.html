<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17181c">
<title>CreationLab Studio - Minecraft Bedrock Addon</title>
<script>
/* CreationLab patch v2 */
(function () {
  var FORCE_ANIM = true;

  /* ---------- 0) ทำให้ทุกเครื่อง (รวมมือถือสเปคต่ำ / iPhone / แอป Google) ได้แอนิเมชันเด้งดึ๋งเต็มรูปแบบ ----------
     โค้ดเดิมตรวจ CPU<=4 คอร์ หรือ RAM<=4GB แล้วตัดแอนิเมชันเด้งทิ้ง (โหมด LITE)
     iPhone/Android ส่วนใหญ่เข้าเงื่อนไขนี้ จึงไม่เด้ง -> บังคับให้ไม่ติดเงื่อนไข */
  try { Object.defineProperty(Navigator.prototype, 'hardwareConcurrency', { get: function () { return 8; }, configurable: true }); } catch (e) {}
  try { Object.defineProperty(Navigator.prototype, 'deviceMemory', { get: function () { return 8; }, configurable: true }); } catch (e) {}

  /* ---------- 1) กันเว็บพังเมื่อ localStorage/sessionStorage ถูกบล็อก (in-app browser, private mode) ---------- */
  ['localStorage', 'sessionStorage'].forEach(function (n) {
    var ok = true;
    try { var s = window[n]; s.setItem('__t', '1'); s.removeItem('__t'); } catch (e) { ok = false; }
    if (ok) return;
    var d = {};
    var api = {
      getItem: function (k) { return k in d ? d[k] : null; },
      setItem: function (k, v) { d[k] = String(v); },
      removeItem: function (k) { delete d[k]; },
      clear: function () { d = {}; }
    };
    var px = new Proxy(api, {
      get: function (t, k) { return k in t ? t[k] : d[k]; },
      set: function (t, k, v) { d[k] = String(v); return true; }
    });
    try { Object.defineProperty(window, n, { value: px, configurable: true }); } catch (e) {}
  });

  /* ---------- 2) ไม่ให้ "ลดการเคลื่อนไหว / ประหยัดแบต" ปิดแอนิเมชัน ---------- */
  if (FORCE_ANIM && window.matchMedia) {
    var mm = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      if (/prefers-reduced-motion/i.test(q)) {
        return { matches: false, media: q, onchange: null, addListener: function () {}, removeListener: function () {},
          addEventListener: function () {}, removeEventListener: function () {}, dispatchEvent: function () { return false; } };
      }
      return mm(q);
    };
  }

  /* ---------- 3) CSS ---------- */
  var css = '' +
    '@supports not (mix-blend-mode:plus-lighter){:root #pTitle .tfx i,:root #spTitle .tfx i{mix-blend-mode:normal}}' +
    (FORCE_ANIM ? '@media (prefers-reduced-motion:reduce){' +
      ':root .logo img{animation:logo-idle 4s ease-in-out infinite}' +
      ':root .tw svg{animation:twinkle var(--t,2.4s) ease-in-out var(--d,0s) infinite}' +
      ':root .sy .cur::after{animation:blink 1s steps(1,end) infinite}' +
      ':root .pp.on #pTitle .tfx i,:root .sp.on #spTitle .tfx i{animation:tshine 3s linear infinite}' +
      ':root .sbar .ring2 i{animation:bspin 5s linear infinite}' +
      ':root .pp-fx .pg{animation:pg-drift var(--t,18s) ease-in-out var(--d,0s) infinite}' +
      ':root .pp-fx .pq{display:block;animation:pq-rise var(--t,9s) linear var(--d,0s) infinite}' +
      '}' : '') +

    /* ความสูงจอจริงบนมือถือ (แถบ URL ของ Safari/Google ขึ้นลงได้) */
    '@supports (height:100dvh){:root .page{min-height:max(100dvh,calc(var(--p)*(2556 - var(--lift))))}' +
    ':root body{min-height:100dvh}}' +

    /* แถบ ออนไลน์/เข้าเว็บ/สินค้า: อยู่เลเยอร์หน้าสุด (เดิมโดน .panel/.abs ทับ) + ขนาดเล็กกระชับ */
    '.hstats{position:relative;z-index:20;display:flex;gap:calc(var(--p)*10);' +
    'width:calc(var(--p)*1131);max-width:calc(100% - 16px);' +
    'height:max(28px,calc(var(--p)*76));' +
    'margin:calc(var(--p)*-80) auto max(calc(var(--p)*10),calc(28px - var(--p)*66));pointer-events:none}' +
    '.hstats[hidden]{display:none}' +
    '.hstats .hs{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;justify-content:center;' +
    'gap:calc(var(--p)*10);padding:0 4px;background:#2b2e3b;border:2px solid #3b3f4d;border-radius:10px;' +
    'font-family:"Minecraft","ThaiPixel","Prompt",sans-serif;text-shadow:0 2px 0 #3b3f4d;white-space:nowrap;overflow:hidden}' +
    '.hstats .hs b{font-weight:400;font-size:clamp(13px,calc(var(--p)*38),19px);line-height:1;color:#eceef4;letter-spacing:.5px}' +
    '.hstats .hs span{font-size:clamp(9px,calc(var(--p)*23),12px);line-height:1;color:#9aa0b8;text-shadow:none}' +
    '.hstats .dt{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6bff8f;' +
    'margin-right:4px;box-shadow:0 0 6px #6bff8f;animation:blink 1.6s steps(1,end) infinite}' +

    /* จอกว้าง: หัวเว็บอยู่กลาง สินค้าเต็มจอ */
    '@media (min-width:760px){' +
    ':root .app{width:100vw}' +
    ':root .page{background:#0d0d0f}' +
    ':root .page::before{content:"";position:absolute;left:50%;top:0;width:calc(var(--p)*1179);height:calc(var(--p)*1500);' +
    'transform:translateX(-50%);background:url(/bg.png) center top/100% auto no-repeat;' +
    '-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}' +
    ':root .page>.abs{margin-left:calc((100vw - var(--p)*1179)/2)}' +
    ':root .panel{left:calc((100vw - var(--p)*1179)/2);right:calc((100vw - var(--p)*1179)/2);bottom:auto;height:calc(var(--p)*640);' +
    '-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}' +
    ':root .panel::after{display:none}' +
    ':root #products{--p:calc(clamp(240px,100vw / 6.5,320px) / 561);width:100%;max-width:1800px;padding:0 24px;' +
    'margin:24px auto 60px;grid-template-columns:repeat(auto-fill,calc(var(--p)*561));justify-content:center;gap:24px}' +
    '}' +

    /* จอเล็กมาก (iPhone SE / Android จอแคบ) */
    '@media (max-width:359px){:root .ptag b{letter-spacing:0}}';
  var st = document.createElement('style');
  st.id = 'extra-css';
  st.textContent = css;
  (document.head || document.documentElement).appendChild(st);

  /* ---------- 4) ตัวเลข 1k ---------- */
  function K(n) {
    n = +n || 0;
    var a = Math.abs(n);
    if (a < 1000) return String(Math.round(n));
    var u = [[1e9, 'B'], [1e6, 'M'], [1e3, 'k']];
    for (var i = 0; i < 3; i++) {
      if (a >= u[i][0]) {
        var v = Math.floor(a / u[i][0] * 10) / 10;
        return (n < 0 ? '-' : '') + (v % 1 ? v.toFixed(1) : v.toFixed(0)) + u[i][1];
      }
    }
  }
  window.fmtK = K;

  /* ---------- 5) แถบ ออนไลน์ / เข้าเว็บ / สินค้า (เปิด-ปิดที่หน้าแอดมิน) ---------- */
  function init() {
    if (typeof SB === 'undefined' || !SB.url) return;
    var prod = document.getElementById('products');
    if (!prod) return;
    var base = SB.url.replace(/\/$/, '');
    var bar = document.createElement('div');
    bar.className = 'hstats';
    bar.hidden = true;
    prod.parentNode.insertBefore(bar, prod);
    var defs = [['online', 'ออนไลน์'], ['visits', 'เข้าเว็บ'], ['products', 'สินค้า']];

    function render(j) {
      var h = '';
      defs.forEach(function (d) {
        if (j[d[0]] == null) return;
        h += '<div class="hs"><b>' + K(j[d[0]]) + '</b><span>' + (d[0] === 'online' ? '<i class="dt"></i>' : '') + d[1] + '</span></div>';
      });
      bar.innerHTML = h;
      bar.hidden = !h;
    }
    function load() {
      if (document.hidden) return;
      fetch(base + '/rest/v1/rpc/home_stats', {
        method: 'POST',
        headers: { apikey: SB.key, 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(render).catch(function () {});
    }
    load();
    setInterval(load, 20000);
    document.addEventListener('visibilitychange', load);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
